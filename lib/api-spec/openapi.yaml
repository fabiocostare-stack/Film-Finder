openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Movie catalog and streaming availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /movies/search:
    get:
      operationId: searchMovies
      tags: [movies]
      summary: Search the movie catalog
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 1
        - name: region
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: IT
      responses:
        "200":
          description: Matching movies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieSearchResponse"
        "400":
          description: Invalid search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/providers:
    get:
      operationId: listMovieProviders
      tags: [movies]
      summary: List streaming services in a region
      parameters:
        - name: region
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: IT
      responses:
        "200":
          description: Streaming services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieProviderListResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/recommendations:
    get:
      operationId: getMovieRecommendations
      tags: [movies]
      summary: Recommend highly rated films matching selected streaming services and watched titles
      parameters:
        - name: region
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: IT
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 1
        - name: genreIds
          in: query
          description: Comma-separated movie genre IDs inferred from watched films and the user's written taste. Matching uses any listed genre.
          schema:
            type: string
            maxLength: 200
        - name: providerIds
          in: query
          required: true
          description: Comma-separated streaming provider IDs selected by the user.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: seedMovieIds
          in: query
          description: Up to four movie IDs from the user's watched list to personalize recommendations by title similarity.
          schema:
            type: string
            maxLength: 100
        - name: excludeIds
          in: query
          description: Comma-separated movie IDs already shown, watched, or dismissed.
          schema:
            type: string
            maxLength: 10000
        - name: taste
          in: query
          description: Optional free-text description used as additional preference context.
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: Personalized movie recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieSearchResponse"
        "400":
          description: Invalid recommendation parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/availability:
    get:
      operationId: getMovieAvailability
      tags: [movies]
      summary: Get streaming availability for one movie
      parameters:
        - name: movieId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: region
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: IT
      responses:
        "200":
          description: Current streaming availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieAvailabilityResponse"
        "400":
          description: Invalid movie ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/credits:
    get:
      operationId: getMovieCredits
      tags: [movies]
      summary: Get a movie's director and main cast
      parameters:
        - name: movieId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Director and principal cast credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieCreditsResponse"
        "400":
          description: Invalid movie ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/credits/batch:
    get:
      operationId: getMovieCreditsBatch
      tags: [movies]
      summary: Get director and main cast for multiple movies
      parameters:
        - name: movieIds
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Comma-separated movie IDs, up to 20 titles
      responses:
        "200":
          description: Credits for the requested movies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieCreditsBatchResponse"
        "400":
          description: Invalid movie IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
  /movies/director-discoveries:
    get:
      operationId: getDirectorDiscoveries
      tags: [movies]
      summary: Recommend directors and highly rated films available on selected services
      parameters:
        - name: region
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: IT
        - name: providerIds
          in: query
          required: true
          description: Comma-separated streaming provider IDs selected by the user.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: watchedMovieIds
          in: query
          description: Comma-separated watched movie IDs used to discover directors and exclude watched films.
          schema:
            type: string
            maxLength: 2000
        - name: followedDirectorIds
          in: query
          description: Comma-separated director IDs explicitly followed by the user.
          schema:
            type: string
            maxLength: 500
        - name: excludeMovieIds
          in: query
          description: Comma-separated movie IDs dismissed from the recommendation feed.
          schema:
            type: string
            maxLength: 4000
      responses:
        "200":
          description: Personalized and popular directors with available film picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectorDiscoveriesResponse"
        "400":
          description: Invalid director discovery parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
        "503":
          description: Movie catalog is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Movie:
      type: object
      required:
        - id
        - title
        - originalTitle
        - overview
        - posterPath
        - backdropPath
        - releaseDate
        - voteAverage
        - genreIds
        - originalLanguage
      properties:
        id:
          type: integer
        title:
          type: string
        originalTitle:
          type: string
        overview:
          type: string
        posterPath:
          type: [string, "null"]
        backdropPath:
          type: [string, "null"]
        releaseDate:
          type: string
        voteAverage:
          type: number
        genreIds:
          type: array
          items:
            type: integer
        originalLanguage:
          type: string
    MovieProvider:
      type: object
      required:
        - id
        - name
        - logoPath
        - displayPriority
      properties:
        id:
          type: integer
        name:
          type: string
        logoPath:
          type: [string, "null"]
        displayPriority:
          type: integer
    MovieSearchResponse:
      type: object
      required:
        - results
        - page
        - totalPages
        - totalResults
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        page:
          type: integer
        totalPages:
          type: integer
        totalResults:
          type: integer
    MovieProviderListResponse:
      type: object
      required:
        - region
        - results
      properties:
        region:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/MovieProvider"
    MovieAvailabilityResponse:
      type: object
      required:
        - movieId
        - region
        - providers
        - link
      properties:
        movieId:
          type: integer
        region:
          type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MovieProvider"
        link:
          type: [string, "null"]
    MovieCreditsResponse:
      type: object
      required:
        - movieId
        - directors
        - cast
        - runtime
      properties:
        movieId:
          type: integer
        directors:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            type: string
        runtime:
          type: [integer, "null"]
    MovieCreditsBatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MovieCreditsResponse"
    DirectorProfile:
      type: object
      required:
        - id
        - name
        - profilePath
      properties:
        id:
          type: integer
        name:
          type: string
        profilePath:
          type: [string, "null"]
    DirectorRecommendation:
      type: object
      required:
        - director
        - source
        - movies
      properties:
        director:
          $ref: "#/components/schemas/DirectorProfile"
        source:
          type: string
          enum: [followed, watched, popular]
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
    DirectorDiscoveriesResponse:
      type: object
      required:
        - personalized
        - discover
      properties:
        personalized:
          type: array
          items:
            $ref: "#/components/schemas/DirectorRecommendation"
        discover:
          type: array
          items:
            $ref: "#/components/schemas/DirectorRecommendation"
    MovieErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string

