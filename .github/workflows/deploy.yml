name: Deploy Film Finder to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared libraries
        run: pnpm run typecheck:libs

      - name: Export Expo web app
        run: pnpm run build:web
        env:
          NODE_ENV: production

      - name: Add PWA tags to index.html
        run: |
          sed -i 's|</head>|<link rel="manifest" href="/Film-Finder2/manifest.json"><meta name="theme-color" content="#111116"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Film Finder"><link rel="apple-touch-icon" href="/Film-Finder2/icon-192.png"></head>|' artifacts/film-finder/dist/index.html

      - name: Add 404.html for SPA routing
        run: cp artifacts/film-finder/dist/index.html artifacts/film-finder/dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/film-finder/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
